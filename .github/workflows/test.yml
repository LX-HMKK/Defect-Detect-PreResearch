# 测试工作流 — 运行不需要 GPU 的测试套件
# anomalib/torch 在 CI 环境中不可用，仅运行纯逻辑测试

name: 测试

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy scipy scikit-learn PyYAML
          pip install fastapi Pillow sse-starlette pydantic python-multipart httpx

      - name: 运行测试
        run: python -m pytest tests/ -v
